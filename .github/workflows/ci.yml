# Проверки на каждый push и pull request: форматирование, линтер, типы, тесты
# с порогом покрытия и сборка. Если что-то красное — в dev и main это не попадёт
# незамеченным, а превью и боевой деплой гоняют те же шаги перед сборкой.

name: Проверки

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Вся история нужна lib/lastmod.ts: даты для карты сайта он берёт из git log
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Форматирование
        run: npm run format:check

      # Без --fix: CI не чинит код молча, а падает
      - name: Линтер
        run: npm run lint:ci

      - name: Типы и шаблоны
        run: npm run check

      # Расчётное ядро: переплата должна сходиться с банковскими графиками,
      # покрытие не ниже порогов из package.json
      - name: Тесты и покрытие
        run: npm run test:coverage

      - name: Сборка
        run: npm run build
